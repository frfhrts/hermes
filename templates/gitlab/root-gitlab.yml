# Main docker build/push template
.package-docker-job:template:
  stage: build
  before_script:
    - docker info
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - export DOCKER_FULLNAME=${CI_REGISTRY_IMAGE}/${DOCKER_PROJECT}/${DOCKER_IMAGENAME}:${DOCKER_TAG}
    - docker pull ${DOCKER_FULLNAME} || true
    - >
      docker build
      --pull
      --no-cache
      --tag ${DOCKER_FULLNAME}
      --build-arg GIT_COMMIT_BRANCH=${CI_COMMIT_BRANCH}
      --build-arg GIT_COMMIT_SHA=${CI_COMMIT_REF_SLUG}
      --build-arg GIT_COMMIT_TIMESTAMP=${CI_COMMIT_TIMESTAMP}
      --build-arg APP_VERSION=${APP_VERSION}
      --build-arg IMAGE=$IMAGE
      -f ${DOCKERFILE_PATH}/Dockerfile .
    - docker push ${DOCKER_FULLNAME}
  rules:
    - !reference [.default-rules, rules]


