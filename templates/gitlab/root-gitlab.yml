default:
  image: ${DOCKER_IMAGE_DOCKER}
  tags:
  # Add tags Based on your runners, all runner tags should match to pick a job
    - os/linux
    - dind

  services:
    - name: ${DOCKER_IMAGE_DOCKER_ROOTLESS}
      alias: docker

.with-postgres:
  services:
    - name: ${DOCKER_IMAGE_POSTGRES}
      alias: ${POSTGRES_HOST},db,postgres,pg
      entrypoint: ["docker-entrypoint.sh"]
      command: ["postgres"]

variables:
  DOCKER_TLS_CERTDIR: "/certs"
  RELEASE_PATTERN: /^v\d+\.\d+\.\d+$/
  RELEASE_PATTERN_BASH: '^v[0-9]+\.[0-9]+\.[0-9]+$'
  POSTGRES_HOST: $POSTGRES_HOST
  POSTGRES_DB: $POSTGRES_DB
  POSTGRES_USER: $POSTGRES_USER
  POSTGRES_PASSWORD: $POSTGRES_PASS
  POSTGRES_HOST_AUTH_METHOD: trust
  PGDATA: "/var/lib/postgresql/data"
  POSTGRES_INITDB_ARGS: "--encoding=UTF8 --data-checksums"
  DOCKER_IMAGE_NODE: docker.io/node:20-bullseye-slim
  DOCKER_IMAGE_POSTGRES: docker.io/postgres:16.6-alpine
  DOCKER_IMAGE_DOCKER: docker.io/docker:27
  DOCKER_IMAGE_DOCKER_ROOTLESS: docker.io/docker:27-dind-rootless
  GITLAB_RELEASE_DOCKER_IMAGE: gitlab/glab:latest

stages:
  - build
  - install
  - test
  - test-integration
  - sign
  - verify
  - retag
  - release
  - deploy

include:
  # - template: Security/Secret-Detection.gitlab-ci.yml enable if you want secret detection service, runs on test stage, no setup needed, enable job below too
  # - template: Jobs/Container-Scanning.gitlab-ci.yml enable if you want docker container scanning
  # - template: Cosign.gitlab-ci.yml enable for docker cosign, you need to configure PKI to use this
  # - local: apps/main/.gitlab-ci.yml In case of microservices add local gitlab-ci imports like this

.default-rules:
  rules:
    - if: '$RENOVATE == "1"'
      when: never
    - if: '$DOCKER_IMAGE_SCAN == "1"'
      when: never
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
      when: always
    - if: "$CI_COMMIT_TAG =~ $RELEASE_PATTERN"
      when: always
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: "$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS"
      when: never
    - if: $CI_COMMIT_BRANCH

  release-rules:
    - if: '$CI_COMMIT_TAG =~ $RELEASE_PATTERN'
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_PIPELINE_SOURCE == "manual"
      when: never

